site_name: FutBoard

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/youtube-timestamps.js

nav:
  - Início: index.md
  - Visão do Produto e Projeto:
      - Cenário Atual do Cliente e Negócio: visao-produto/cenario-atual.md
      - Solução Proposta: visao-produto/solucao-proposta.md
      - Intervenção Social: visao-produto/intervencao-social.md
      - Estratégias de Software: visao-produto/estrategias-esw.md
      - Engenharia de Requisitos: visao-produto/engenharia-requisitos.md
      - Cronograma e Entregas: visao-produto/cronogramas-entregas.md
      - Interação com Cliente: visao-produto/interacao-equipe-cliente.md
      - Requisitos de Software: visao-produto/Requisitos-de-Software.md
      - DoR e DoD: visao-produto/dor-dod.md
      - Backlog do Produto: visao-produto/backlog_do_produto.md
  - Catálogo de termos do Futboard:
      - Catálogo de termos do Futboard: catalogos-termos/catalogos-termos.md    
  - Reuniões:
      - Reuniões da equipe: atas-reunioes/reunioes-da-equipe.md
      - Reuniões com o cliente: atas-reunioes/reunioes-cliente.md
  - Lições Aprendidas: licoes-aprendidas.md
  - Entregas da Unidade: entregas-unidade/entregas-unidade.md

