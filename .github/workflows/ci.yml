name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: futboard
          POSTGRES_USER: futboard
          POSTGRES_PASSWORD: futboard-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U futboard -d futboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: django-insecure-ci-only
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: futboard
      POSTGRES_USER: futboard
      POSTGRES_PASSWORD: futboard-dev
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Verificar configuração do Django
        run: python manage.py check

      - name: Executar testes
        run: python manage.py test

      - name: Verificar lint
        run: ruff check apps/ciclos

      - name: Verificar formatação
        run: ruff format --check apps/ciclos

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Gerar build
        run: npm run build
